[project]
name = "discovery"
version = "0.1.0"
description = "Harness for model discovery"
readme = "README.md"
authors = [
    { name = "Giovanni", email = "giovanni.charles@gmail.com" }
]
# the harness itself is 3.11-clean; the floor is arviz-stats, which the
# `examples` group needs and which requires >=3.12
requires-python = ">=3.12"
dependencies = [
    "openai>=2.0",
]

[project.scripts]
discovery = "discovery:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
]
#: what an analysis pool's workers need; a setup module supplies the data itself
analysis = [
    "numpy>=2.0",
    "pandas>=2.2",
]
examples = [
    { include-group = "analysis" },
    "numpyro>=0.21",
    "jax>=0.7",
    "arviz-stats>=1.2",
    "matplotlib>=3.10",
]
#: the malaria example only. `msinf` is not on PyPI, so it comes from a sibling
#: checkout; it is its own group so `examples` stays installable without one.
#: Both projects are `>=3.11`, so this is one environment and one interpreter.
malaria = [
    "msinf",
]

[tool.uv.sources]
msinf = { path = "../msinf", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
