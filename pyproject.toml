[project]
name = "discovery"
version = "0.1.0"
description = "Harness for model discovery"
readme = "README.md"
authors = [
    { name = "Giovanni", email = "giovanni.charles@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "openai>=2.0",
]

[project.scripts]
discovery = "discovery:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
]
#: what an analysis pool's workers need; a setup module supplies the data itself
analysis = [
    "numpy>=2.0",
    "pandas>=2.2",
]
examples = [
    { include-group = "analysis" },
    "numpyro>=0.21",
    "jax>=0.7",
    "arviz-stats>=1.2",
    "matplotlib>=3.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
